            d="M0 3.3665V0.830994H11.946V3.3665H7.4929V15.3764H4.45312V3.3665H0Z"
            fill="white"
          />
        </svg>
      </div>

      <!-- 세로 정렬 영문 가이드 팁 -->

      <div class="mt-8 flex flex-col gap-2 w-fit pointer-events-auto">
        <div
          class="px-3.5 py-1.5 rounded-full glass-panel text-[11px] text-gray-300 flex items-center gap-2 shadow-lg border border-white/10"
        >
          <span class="w-1.5 h-1.5 rounded-full bg-indigo-400"></span>

          <span class="font-medium text-gray-200">Drag:</span> Draw Thread
        </div>

        <div
          class="px-3.5 py-1.5 rounded-full glass-panel text-[11px] text-gray-300 flex items-center gap-2 shadow-lg border border-white/10"
        >
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>

          <span class="font-medium text-gray-200">Click:</span> Write / Read
        </div>

        <div
          class="px-3.5 py-1.5 rounded-full glass-panel text-[11px] text-gray-300 flex items-center gap-2 shadow-lg border border-white/10"
        >
          <span class="w-1.5 h-1.5 rounded-full bg-amber-300"></span>

          <span class="font-medium text-gray-200">Hold Bead:</span> Delete
        </div>

        <div
          class="px-3.5 py-1.5 rounded-full glass-panel text-[11px] text-gray-300 flex items-center gap-2 shadow-lg border border-white/10"
        >
          <span class="w-1.5 h-1.5 rounded-full bg-rose-400"></span>

          <span class="font-medium text-gray-200"
            >Hold Space with two fingers:</span
          >

          Cut Thread
        </div>
      </div>
    </div>

    <!-- ✦ 왼쪽 하단 신규 심볼 로고 배치 -->

    <div class="fixed bottom-5 left-5 z-30 pointer-events-none drop-shadow-xl">
      <svg
        width="130"
        height="106"
        viewBox="0 0 130 106"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M123.404 68.5847L124.185 70.416L34.8633 104.885L34.0824 103.054L123.404 68.5847ZM126.837 60.8624L103.409 5.92485C102.115 2.89073 98.4806 1.42889 95.2911 2.65973L5.96907 37.1292C2.77956 38.36 1.24284 41.8175 2.53672 44.8516L25.9645 99.7891C27.2584 102.823 30.8929 104.285 34.0824 103.054L34.8633 104.885C30.7435 106.475 26.0667 104.696 24.21 100.905L24.0394 100.532L0.611677 45.5945C-1.11349 41.549 0.935462 36.9391 5.18815 35.2979L94.5102 0.828476L94.9104 0.684847C99.0626 -0.689002 103.663 1.26292 105.334 5.18197L128.762 60.1195L128.913 60.5002C130.31 64.3227 128.434 68.5445 124.578 70.2538L124.185 70.416L123.404 68.5847C126.594 67.3539 128.131 63.8965 126.837 60.8624Z"
          fill="white"
        />
        <path
          d="M67.8632 54.3362C66.9182 55.7826 65.1052 56.4909 63.3644 56.0935L5.25786 42.8296C1.33755 41.9347 0.919361 36.7868 4.64878 35.33L5.43789 37.1581C3.57318 37.8865 3.78229 40.4604 5.74244 40.9079L63.849 54.1718C64.7194 54.3705 65.6263 54.0162 66.0987 53.293L97.638 5.01096C98.7019 3.38222 96.9492 1.4113 95.0845 2.1397L94.2953 0.311628L94.4703 0.247461C98.1332 -1.02197 101.498 2.84732 99.4032 6.05386L67.8632 54.3362ZM5.43789 37.1581L4.64878 35.33L94.2953 0.311628L95.0845 2.1397L5.43789 37.1581Z"
          fill="white"
        />
        <circle cx="65.8855" cy="54.857" r="4" fill="white" />
      </svg>
    </div>

    <!-- p5.js Canvas Container -->
    <div id="canvas-container"></div>

    <!-- Modal 1: 수신인 입력 모달 -->
    <div
      id="name-modal"
      class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-md p-4"
    >
      <div
        class="glass-panel p-6 rounded-2xl w-80 shadow-2xl border border-white/10"
      >
        <h3 class="text-base font-medium text-gray-200 mb-1">
          이 실의 이름은?
        </h3>
        <p class="text-xs text-gray-400 mb-4">
          편지를 받는 사람의 이름을 적어주세요.
        </p>
        <input
          type="text"
          id="recipient-input"
          placeholder="이름 입력 (예: 연주, 나에게)"
          class="w-full px-3 py-2 bg-white/5 border border-white/15 rounded-xl text-sm text-white focus:outline-none focus:border-indigo-400 mb-4"
          maxlength="12"
        />
        <div class="flex justify-end gap-2">
          <button
            id="cancel-name-btn"
            type="button"
            class="px-4 py-1.5 text-xs text-gray-400 hover:text-white"
          >
            취소
          </button>
          <button
            id="save-name-btn"
            type="button"
            class="px-4 py-1.5 text-xs bg-indigo-500 hover:bg-indigo-600 text-white rounded-lg font-medium"
          >
            완료
          </button>
        </div>
      </div>
    </div>

    <!-- Modal 2: 편지 작성 모달 -->
    <div
      id="write-modal"
      class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-md p-4"
    >
      <div
        class="glass-panel p-6 rounded-2xl w-[90vw] max-w-md shadow-2xl border border-white/10"
      >
        <div class="flex justify-between items-center mb-4">
          <div>
            <h3
              id="write-modal-title"
              class="text-base font-medium text-gray-200"
            >
              편지 남기기
            </h3>
            <p id="write-modal-date" class="text-xs text-gray-400 mt-0.5"></p>
          </div>
          <button
            id="close-write-btn"
            type="button"
            class="text-gray-400 hover:text-white p-1"
          >
            ✕
          </button>
        </div>
        <div class="space-y-4">
          <textarea
            id="letter-text-input"
            rows="4"
            placeholder="마음속에 담아두었던 이야기를 써내려가 보세요..."
            class="w-full p-3 bg-white/5 border border-white/15 rounded-xl text-sm text-gray-100 focus:outline-none focus:border-indigo-400 resize-none"
          ></textarea>
          <div class="grid grid-cols-2 gap-2">
            <button
              id="trigger-camera-btn"
              type="button"
              class="py-2 px-3 bg-indigo-500/20 border border-indigo-500/40 rounded-xl text-xs text-indigo-300"
            >
              카메라 촬영
            </button>
            <input
              type="file"
              id="letter-img-input"
              accept="image/*"
              class="hidden"
            />
            <button
              id="trigger-file-btn"
              type="button"
              class="py-2 px-3 bg-white/5 border border-white/15 rounded-xl text-xs text-gray-300"
            >
              앨범에서 선택
            </button>
          </div>
          <div
            id="img-preview-container"
            class="hidden relative w-full h-24 bg-black/40 rounded-lg overflow-hidden border border-white/10"
          >
            <img id="img-preview" class="w-full h-full object-cover" />
            <button
              id="remove-img-btn"
              type="button"
              class="absolute top-1 right-1 bg-black/75 text-white p-1 rounded-full text-xs"
            >
              ✕
            </button>
          </div>
          <button
            id="save-letter-btn"
            type="button"
            class="w-full py-3 bg-indigo-500 hover:bg-indigo-600 text-white rounded-xl text-sm font-medium shadow-lg"
          >
            실에 꿰어 보관하기
          </button>
        </div>
      </div>
    </div>

    <!-- Modal 3: 카메라 촬영 모달 -->
    <div
      id="camera-modal"
      class="hidden fixed inset-0 z-[60] flex items-center justify-center bg-black/80 p-4"
    >
      <div
        class="glass-panel p-4 rounded-2xl w-[90vw] max-w-md text-center border border-white/10"
      >
        <h3 class="text-sm font-medium text-gray-200 mb-3">
          손편지를 사진으로 기록하세요
        </h3>
        <div
          class="relative w-full h-64 bg-black rounded-xl overflow-hidden mb-3 border border-white/10"
        >
          <video
            id="camera-stream"
            autoplay
            playsinline
            class="w-full h-full object-cover"
          ></video>
          <canvas id="camera-canvas" class="hidden"></canvas>
        </div>
        <div class="flex justify-center gap-3">
          <button
            id="close-camera-btn"
            type="button"
            class="px-5 py-2 text-xs bg-white/10 text-gray-300 rounded-xl"
          >
            취소
          </button>
          <button
            id="capture-photo-btn"
            type="button"
            class="px-6 py-2 text-xs bg-rose-500 text-white rounded-xl font-medium"
          >
            찰칵 📸
          </button>
        </div>
      </div>
    </div>

    <!-- Modal 4: 편지 읽기 모달 -->
    <div
      id="read-modal"
      class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-md p-4"
    >
      <div
        class="glass-panel p-6 rounded-2xl w-[90vw] max-w-md shadow-2xl border border-white/10 relative"
      >
        <div
          class="flex justify-between items-start mb-4 border-b border-white/10 pb-3"
        >
          <div>
            <h3
              id="read-modal-recipient"
              class="text-base font-medium text-gray-200"
            ></h3>
            <p id="read-modal-date" class="text-xs text-gray-400 mt-0.5"></p>
          </div>
          <button
            id="close-read-btn"
            type="button"
            class="text-gray-400 hover:text-white p-1"
          >
            ✕
          </button>
        </div>
        <div class="space-y-4 max-h-[60vh] overflow-y-auto">
          <div
            id="read-modal-img-container"
            class="hidden w-full rounded-xl overflow-hidden border border-white/10 bg-black/40"
          >
            <img id="read-modal-img" class="w-full max-h-60 object-contain" />
          </div>
          <p
            id="read-modal-text"
            class="text-sm text-gray-200 whitespace-pre-wrap leading-relaxed font-light"
          ></p>
        </div>
      </div>
    </div>

    <script src="sketch.js"></script>
  </body>
</html>
<!-- 우측 상단 Room 전환 탭 -->
<div class="fixed top-5 right-5 z-30 flex items-center gap-2">
  <div
    class="glass-panel p-1 rounded-xl flex gap-1 shadow-xl border border-white/10"
  >
    <button
      id="room-btn-1"
      onclick="switchRoom(1)"
      class="px-3 py-1.5 text-xs font-medium rounded-lg transition-all bg-indigo-500 text-white shadow"
    >
      Room 1
    </button>
    <button
      id="room-btn-2"
      onclick="switchRoom(2)"
      class="px-3 py-1.5 text-xs font-medium rounded-lg transition-all text-gray-400 hover:text-white"
    >
      Room 2
    </button>
    <button
      id="room-btn-3"
      onclick="switchRoom(3)"
      class="px-3 py-1.5 text-xs font-medium rounded-lg transition-all text-gray-400 hover:text-white"
    >
      Room 3
    </button>
  </div>
</div>
